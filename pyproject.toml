# Usage: 
#   pip install -e .

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6-template"
version = "1.0.0"
description = "A Qt6 application"
readme = "README.md"
authors = [
    {name = "Mag. Stefan Hagmann"},
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["pyside6", "gui", "desktop"]

dependencies = [
    "pyside6-essentials>=6.4.0",
    "qrcode",
    "pillow",
    "tomli",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pyqt6-tools",
    "build",
    "wheel",
    "tomli ; python_version < '3.11'",
]
briefcase = [
    "briefcase>=0.3.0",
]

[tool.setuptools]

# PyInstaller configuration -----------------------------------------------------------
[tool.qrcode.build]
app_name = "QRCode"
app_module = "src/main.py"
icon = "src/assets/app.ico"
data_files = [
    "src/qrcode_app/css",
    "src/qrcode_app/ui",
]
output_dir = "dist"
build_mode = "onedir"  # onedir or onefile
clean = true
noconfirm = true
windowed = true
# modules that we need in the project > min output
hidden_imports = [
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtWidgets",
    "PySide6.QtPrintSupport",
    "qrcode",
    "qrcode_app.ui.Ui_MainWindow",
]
collect_all = []
strip = true   # Strip debug symbols (Unix only, ignored on Windows)
upx = false     # UPX compression: true = use if upx in PATH, false = --noupx
upx_dir = "C:/upx"  # Path to upx.exe directory (optional, if not in PATH)
# DLLs that UPX cannot compress on Windows — add more if you see "Failed to upx" warnings
upx_exclude = [
    "python3.dll",
    "python312.dll",
    "vcruntime140.dll",
    "vcruntime140_1.dll",
    "msvcp140.dll",
]
# dont use PyQT6, exclude large unused packages to minimize output size
exclude_modules = [
    "PyQt6",
    "pyqt6",
    "matplotlib",
    "scipy",
    "numpy",
    "pandas",
    "wx",
    "IPython",
    "jupyter",
    "notebook",
    "tkinter",
    "test",
    "unittest",
    "doctest",
    "pydoc",
    "xmlrpc",
    "ftplib",
    "poplib",
    "imaplib",
    "smtplib",
    "http.server",
]
log_level = "WARN"

# Briefcase configuration -------------------------------------------------------------
[tool.briefcase]
project_name = "QRCode"
bundle = "org.qrcode"
version = "0.1.0"
license = "GPL-3.0-or-later"


[tool.briefcase.app.qrcode_app]
formal_name = "QRCode"
description = "Python IDE for running QRCode"
sources = ["src/qrcode_app"]
requires = ["pyside6-essentials>=6.4.0"]
icon = "qrcode_app/assets/app"
license-files = ["LICENSE"]

[tool.briefcase.app.qrcode_app.windows]
requires = [
    "pyside6-essentials>=6.4.0",
]
system_installer = true

